[package]
name = "llm-api-proxy-recorder-desktop"
version = "2.1.1"
description = "LLM API Proxy Recorder desktop application"
authors = ["LLM Proxy Recorder contributors"]
edition = "2021"

[lib]
name = "llm_api_proxy_recorder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
