[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-proxy-recorder"
version = "2.1.1"
description = "本地大模型 API 代理记录器：透明转发并落盘调用明细"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pywinpty>=2.2; sys_platform == 'win32'",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
desktop = [
    "pyinstaller>=6.0",
]
socks = ["httpx[socks]"]

[project.scripts]
llm-api-proxy-recorder = "llm_api_proxy_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["llm_api_proxy_recorder*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
llm_api_proxy_recorder = [
    "web/static/*",
    "web/static/vendor/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
