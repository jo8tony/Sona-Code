[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sona-code"
version = "2.2.1"
description = "Sona Code：透明转发并记录大模型 API 调用"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pywinpty>=2.2; sys_platform == 'win32'",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
desktop = [
    "pyinstaller>=6.0",
]
socks = ["httpx[socks]"]

[project.scripts]
sona-code = "sona_code.cli:main"

[tool.setuptools.packages.find]
include = ["sona_code*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sona_code = [
    "web/static/*",
    "web/static/vendor/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
