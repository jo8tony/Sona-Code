name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and upload (e.g. v1.2.0); leave empty for build only"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,desktop]"

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve OpenCode build recipe
        id: opencode-recipe
        shell: pwsh
        run: |
          $BuildRecipe = (python scripts/prepare-opencode.py --print-recipe).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve OpenCode build recipe" }
          "sha256=$BuildRecipe" >> $env:GITHUB_OUTPUT

      - name: Cache verified OpenCode build inputs and patched binary
        uses: actions/cache@v4
        with:
          path: |
            build/opencode/archives
            build/opencode/*/opencode.exe
            build/opencode/*/receipt.json
            build/opencode/*/models.json
          key: opencode-windows-x64-patched-${{ steps.opencode-recipe.outputs.sha256 }}

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Verify patched OpenCode V1 compatibility
        env:
          OPENCODE_TEST_BINARIES: ${{ github.workspace }}/src-tauri/binaries/opencode-x86_64-pc-windows-msvc.exe
        run: python -m pytest tests/test_models_native.py tests/test_workspace_queue_native.py -q

      - name: Build Windows installer
        run: npm exec tauri build -- --bundles nsis

      - name: Smoke test installed sidecars
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          if (-not $Installer) { throw "NSIS installer not found" }
          $InstallDir = Join-Path $env:RUNNER_TEMP "sona-code-smoke"
          $Process = Start-Process -FilePath $Installer -ArgumentList @("/S", "/D=$InstallDir") -WindowStyle Hidden -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Silent install failed: $($Process.ExitCode)" }
          $OpenCode = Get-ChildItem $InstallDir -Recurse -File -Filter "opencode.exe" | Select-Object -First 1
          $Recorder = Get-ChildItem $InstallDir -Recurse -File -Filter "sona-code-sidecar.exe" | Select-Object -First 1
          $Desktop = Get-ChildItem $InstallDir -Recurse -File -Filter "sona-code-desktop.exe" | Select-Object -First 1
          $License = Get-ChildItem $InstallDir -Recurse -File -Filter "OpenCode-LICENSE.txt" | Select-Object -First 1
          if (-not $OpenCode) { throw "Installed opencode.exe not found" }
          if (-not $Recorder) { throw "Installed recorder sidecar not found" }
          if (-not $Desktop) { throw "Installed desktop executable not found" }
          if (-not $License) { throw "Installed OpenCode license not found" }
          $ExpectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "src-tauri/binaries/opencode-x86_64-pc-windows-msvc.exe").Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $OpenCode.FullName).Hash -ne $ExpectedHash) { throw "Installed OpenCode differs from verified patched build" }
          & $OpenCode.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Installed OpenCode smoke test failed" }
          python ./scripts/smoke-windows-package.py `
            --desktop $Desktop.FullName `
            --recorder $Recorder.FullName `
            --opencode $OpenCode.FullName

      - name: Build Electron installer
        run: npm run desktop:build:windows:electron:package

      - name: Smoke test Electron installer
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem "dist/electron/Sona-Code-*-Setup.exe" | Select-Object -First 1).FullName
          if (-not $Installer) { throw "Electron installer not found" }
          $InstallDir = Join-Path $env:RUNNER_TEMP "sona-code-electron-smoke"
          $Process = Start-Process -FilePath $Installer -ArgumentList @("/S", "/D=$InstallDir") -WindowStyle Hidden -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Electron silent install failed: $($Process.ExitCode)" }
          $Desktop = Join-Path $InstallDir "Sona Code.exe"
          $Recorder = Join-Path $InstallDir "resources/sona-code-sidecar.exe"
          $OpenCode = Join-Path $InstallDir "resources/opencode.exe"
          $License = Join-Path $InstallDir "resources/licenses/OpenCode-LICENSE.txt"
          foreach ($File in @($Desktop, $Recorder, $OpenCode, $License, (Join-Path $InstallDir "chrome_100_percent.pak"))) {
            if (-not (Test-Path $File)) { throw "Electron installation missing: $File" }
          }
          $ExpectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "src-tauri/binaries/opencode-x86_64-pc-windows-msvc.exe").Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $OpenCode).Hash -ne $ExpectedHash) { throw "Installed Electron OpenCode differs from verified patched build" }
          Add-Type -AssemblyName System.Drawing
          $Expected = (New-Object System.Drawing.Icon((Resolve-Path "src-tauri/icons/icon.ico").Path, (New-Object System.Drawing.Size(32, 32)))).ToBitmap()
          $Actual = [System.Drawing.Icon]::ExtractAssociatedIcon($Desktop).ToBitmap()
          if ($Expected.Width -ne $Actual.Width -or $Expected.Height -ne $Actual.Height) { throw "Installed desktop icon size mismatch" }
          for ($Y = 0; $Y -lt $Expected.Height; $Y++) {
            for ($X = 0; $X -lt $Expected.Width; $X++) {
              if ($Expected.GetPixel($X, $Y).ToArgb() -ne $Actual.GetPixel($X, $Y).ToArgb()) {
                throw "Installed desktop icon does not match the Sona Code icon"
              }
            }
          }
          python ./scripts/smoke-windows-package.py `
            --electron `
            --desktop $Desktop `
            --recorder $Recorder `
            --opencode $OpenCode

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sona-code-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: sona-code-windows-x64-electron
          path: dist/electron/Sona-Code-*-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Require affected Windows verification before release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: python scripts/prepare-opencode.py --release-check

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: ${{ (inputs.release_tag || github.ref_name) == 'v2.3.1' && 'docs/releases/v2.3.1.md' || (inputs.release_tag || github.ref_name) == 'v2.2.1' && 'docs/releases/v2.2.1.md' || (inputs.release_tag || github.ref_name) == 'v2.1.1' && 'docs/releases/v2.1.1.md' || (inputs.release_tag || github.ref_name) == 'v2.0.1' && 'docs/releases/v2.0.1.md' || '' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/electron/Sona-Code-*-Setup.exe
          fail_on_unmatched_files: true
