name: Build macOS Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and upload (e.g. v1.2.0); leave empty for build only"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Check runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Python dependencies
        run: |
          python -m venv .venv-build
          .venv-build/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-build/bin/python -m pip install -e ".[dev,desktop]"

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: .venv-build/bin/python -m pytest tests/ -q

      - name: Build macOS app and DMG
        run: npm run desktop:build

      - name: Verify macOS package
        run: |
          app="src-tauri/target/release/bundle/macos/Sona Code.app"
          sidecar="$app/Contents/MacOS/llm-api-proxy-recorder-sidecar"
          desktop="$app/Contents/MacOS/llm-api-proxy-recorder-desktop"
          test -x "$sidecar"
          test -x "$desktop"
          lipo "$sidecar" -verify_arch "${{ matrix.arch }}"
          lipo "$desktop" -verify_arch "${{ matrix.arch }}"
          codesign --verify --deep --strict "$app"
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: sona-code-macos-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: ${{ (inputs.release_tag || github.ref_name) == 'v2.1.1' && 'docs/releases/v2.1.1.md' || (inputs.release_tag || github.ref_name) == 'v2.0.1' && 'docs/releases/v2.0.1.md' || '' }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
