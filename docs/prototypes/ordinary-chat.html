<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sona Code · 普通对话原型</title>
  <style>
    :root { --blue: #3975e9; --blue-dark: #285fc9; --blue-soft: #edf3ff; --ink: #202939; --muted: #788396; --line: #e7ebf1; --side: #f8f9fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: var(--ink); background: #fff; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button { color: inherit; }
    button:disabled { cursor: default; opacity: .4; }
    button, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; color: var(--muted); background: transparent; }
    .icon-btn:hover { background: #edf0f5; color: var(--ink); }
    .app { height: 100dvh; min-height: 560px; display: flex; flex-direction: column; }
    .topbar { height: 53px; flex: none; padding: 0 22px; display: flex; align-items: center; border-bottom: 1px solid var(--line); gap: 32px; background: #fff; }
    .top-brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; letter-spacing: -.3px; white-space: nowrap; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; color: #fff; border-radius: 8px; background: linear-gradient(145deg, #598cf5, #3164d0); font-size: 20px; font-weight: 650; }
    .top-nav { display: flex; height: 100%; gap: 24px; align-items: stretch; }
    .nav-item { border: 0; padding: 0 2px; background: transparent; color: #7b8391; font-size: 13px; border-bottom: 2px solid transparent; }
    .nav-item.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .prototype { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8790a0; white-space: nowrap; }
    .prototype-dot { width: 6px; height: 6px; border-radius: 50%; background: #b2bdcc; }
    .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px minmax(0, 1fr); }
    .sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .side-top { padding: 16px 16px 12px; }
    .side-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; margin-bottom: 12px; }
    .side-heading span { font-size: 15px; font-weight: 650; }
    .new-chat { display: flex; gap: 9px; justify-content: center; align-items: center; width: 100%; height: 42px; border: 1px solid var(--blue); border-radius: 9px; background: var(--blue); color: #fff; font-weight: 550; box-shadow: 0 3px 7px #3975e918; }
    .new-chat:hover { background: var(--blue-dark); }
    .side-switch { display: flex; gap: 3px; padding: 3px; margin: 0 0 10px; border: 1px solid #e3e8f0; border-radius: 8px; background: #edf1f6; }
    .side-switch button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: #8a95a6; font-size: 12px; }
    .side-switch button[aria-pressed="true"] { color: #315eac; background: #fff; box-shadow: 0 1px 4px #243c6010; font-weight: 600; }
    .side-switch .icon { width: 14px; height: 14px; }
    .return-projects { display: flex; align-items: center; gap: 6px; margin-right: 9px; padding: 7px 10px; border: 1px solid #e3e9f4; border-radius: 7px; background: #f8faff; color: #6480ad; font-size: 11px; white-space: nowrap; }
    .return-projects:hover { color: var(--blue); border-color: #c6d6f0; }
    .return-projects .icon { width: 14px; height: 14px; }
    .search { display: flex; align-items: center; margin-top: 15px; height: 36px; border: 1px solid #e3e7ee; border-radius: 8px; padding: 0 10px; background: #fff; gap: 7px; color: #929bad; }
    .search .icon { width: 15px; height: 15px; }
    .search input { width: 100%; min-width: 0; outline: none; border: 0; font-size: 12px; background: transparent; color: var(--ink); }
    .search input::placeholder { color: #929bad; }
    .search kbd { font-family: inherit; font-size: 10px; padding: 2px 4px; border: 1px solid #edf0f4; border-radius: 3px; white-space: nowrap; }
    .side-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 10px 24px; scrollbar-width: thin; }
    .section-heading { height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 7px; padding: 0 12px; color: #6b7687; font-size: 12px; font-weight: 550; }
    .section-heading .heading-copy { display: flex; align-items: center; gap: 8px; }
    .section-heading .icon { width: 15px; height: 15px; }
    .section-heading .count { font-size: 11px; color: #9aa3b1; font-weight: 400; }
    .day-label { margin: 11px 13px 7px; font-size: 11px; color: #9aa3b1; }
    .thread { width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 12px; margin-bottom: 3px; background: transparent; border: 1px solid transparent; border-radius: 8px; text-align: left; min-height: 43px; }
    .thread > .icon { width: 15px; height: 15px; color: #9aa5b5; }
    .thread:hover { background: #edf0f5; }
    .thread.active { background: #eaf1ff; color: #2e62bd; border-color: #dae6fc; }
    .thread.active > .icon { color: #4e7bce; }
    .thread-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 12.5px; }
    .pin { width: 12px; height: 12px; color: #8997ae; }
    .side-divider { height: 1px; background: var(--line); margin: 20px 12px 12px; }
    .project { margin-top: 3px; }
    .project-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 11px; background: transparent; border: 0; border-radius: 8px; text-align: left; }
    .project-head:hover { background: #edf0f5; }
    .project-head > .icon { width: 13px; height: 13px; color: #99a3b4; transition: transform .15s; }
    .project-head[aria-expanded="true"] > .icon { transform: rotate(90deg); }
    .folder { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; color: #5e7ab3; background: #eaf0fc; }
    .folder .icon { width: 15px; height: 15px; }
    .project-name { flex: 1; font-size: 12.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-count { font-size: 11px; color: #99a3b4; }
    .project-threads { margin: 5px 0 10px 26px; border-left: 1px solid #dfe5ef; padding-left: 7px; }
    .project-threads .thread { padding: 9px; min-height: 37px; }
    .add-project { font-size: 11px; padding: 4px 0; display: flex; gap: 3px; align-items: center; background: transparent; border: 0; color: #8995a7; }
    .add-project:hover { color: var(--blue); }
    .add-project .icon { width: 13px; height: 13px; }
    .empty-search { color: var(--muted); text-align: center; padding: 25px 12px; font-size: 12px; }
    .side-bottom { padding: 15px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 31px; height: 31px; flex: none; background: #e6ebf4; border: 1px solid #dde4ef; border-radius: 50%; display: grid; place-items: center; color: #607490; font-size: 11px; font-weight: 600; }
    .account { flex: 1; font-size: 12px; font-weight: 550; }
    .account small { display: block; color: #939dac; font-size: 10px; font-weight: 400; margin-top: 3px; }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    .main-header { height: 80px; flex: none; border-bottom: 1px solid var(--line); padding: 0 32px; display: flex; align-items: center; gap: 12px; }
    .header-copy { flex: 1; min-width: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 7px; color: #939cac; font-size: 11px; margin-bottom: 6px; }
    .breadcrumb .icon { width: 12px; height: 12px; }
    .title-row { display: flex; align-items: center; gap: 11px; min-width: 0; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type-badge { border-radius: 5px; background: #f0f4fa; color: #8090a6; font-size: 10px; padding: 4px 6px; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 3px; }
    .menu-anchor { position: relative; }
    .popover { position: absolute; z-index: 15; border: 1px solid #e2e7ef; border-radius: 11px; background: #fff; box-shadow: 0 10px 40px #243c6020; padding: 6px; width: 188px; }
    .popover.menu { right: 0; top: 42px; }
    .popover button { width: 100%; min-height: 36px; display: flex; align-items: center; gap: 9px; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; }
    .popover button:hover { background: #f4f6fa; }
    .popover button.danger { color: #c96060; }
    .popover .icon { width: 15px; height: 15px; }
    .project-tabs { display: flex; flex: none; gap: 26px; padding: 0 32px; border-bottom: 1px solid var(--line); height: 43px; }
    .project-tabs button { border: 0; background: transparent; font-size: 12px; color: var(--muted); padding: 0 1px; border-bottom: 2px solid transparent; }
    .project-tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }
    .conversation { flex: 1; min-height: 0; display: flex; }
    .scroll { flex: 1; min-width: 0; overflow: auto; padding: 0 32px; scrollbar-width: thin; }
    .welcome { max-width: 660px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 40px 0 38px; }
    .welcome-brand { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; margin-bottom: 23px; color: var(--blue); background: linear-gradient(145deg, #f0f5ff, #e9f0ff); border: 1px solid #e4edff; }
    .welcome-brand .icon { width: 27px; height: 27px; stroke-width: 1.35; }
    .welcome h2 { font-size: 30px; font-weight: 600; letter-spacing: -1px; margin: 0 0 12px; }
    .welcome-sub { margin: 0; color: #8791a1; font-size: 13px; line-height: 1.8; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
    .suggestion { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 16px 17px; position: relative; transition: border-color .15s, background .15s; }
    .suggestion:hover { border-color: #c4d7fb; background: #fbfcff; }
    .suggestion-title { display: flex; align-items: center; gap: 9px; font-weight: 550; font-size: 13px; }
    .suggestion-title .icon { width: 17px; height: 17px; color: #7387ab; }
    .suggestion-sub { display: block; color: #939cab; font-size: 11px; margin: 9px 22px 0 26px; line-height: 1.65; }
    .suggestion > .icon { position: absolute; right: 15px; bottom: 18px; width: 13px; height: 13px; color: #bdc6d3; }
    .welcome-foot { display: flex; align-items: center; gap: 6px; margin-top: 23px; font-size: 11px; color: #a0a9b7; }
    .welcome-foot .icon { width: 13px; height: 13px; }
    .messages { max-width: 740px; margin: 0 auto; padding: 25px 0 35px; }
    .date-divider { color: #a1aabb; text-align: center; font-size: 10px; margin: 0 0 27px; }
    .message { margin: 0 0 30px; }
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .user-bubble { max-width: 85%; padding: 13px 18px; background: #f1f4f9; border-radius: 15px 15px 4px 15px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .message-images img { max-width: 180px; max-height: 140px; border-radius: 10px; object-fit: contain; }
    .assistant-heading { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; margin-bottom: 13px; }
    .assistant-mark { width: 25px; height: 25px; background: var(--blue-soft); color: var(--blue); border-radius: 8px; display: grid; place-items: center; }
    .assistant-mark .icon { width: 16px; height: 16px; }
    .message-model { color: #9aa3b2; font-size: 10px; font-weight: 400; }
    .assistant-body { padding-left: 34px; font-size: 13px; line-height: 1.9; overflow-wrap: anywhere; }
    .assistant-body p { margin: 0 0 13px; white-space: pre-wrap; }
    .assistant-body h3 { font-size: 14px; font-weight: 600; margin: 21px 0 8px; }
    .assistant-body ul { margin: 7px 0 15px; padding-left: 20px; }
    .assistant-body li { padding-left: 3px; margin-bottom: 5px; }
    .assistant-body strong { font-weight: 600; }
    .assistant-body blockquote { border-left: 2px solid #cbdaf7; padding-left: 14px; color: #77869d; margin: 18px 0; }
    .message-actions { display: flex; align-items: center; gap: 2px; padding-left: 28px; margin-top: 12px; }
    .message-actions .icon-btn { width: 28px; height: 28px; }
    .message-actions .icon { width: 14px; height: 14px; }
    .message-time { color: #a1aaba; font-size: 10px; margin-left: 8px; }
    .typing { display: flex; gap: 5px; padding: 9px 0 15px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: #a4b7d8; animation: pulse 1s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: .3; transform: translateY(-3px); } }
    .composer-dock { flex: none; padding: 12px 32px 18px; background: #fff; }
    .composer-wrap { max-width: 740px; margin: 0 auto; }
    .composer { border: 1px solid #dfe5ee; background: #fff; border-radius: 15px; padding: 15px 16px 11px; box-shadow: 0 3px 16px #263e6506; transition: border-color .15s, box-shadow .15s; }
    .composer:focus-within { border-color: #a7c3f7; box-shadow: 0 0 0 3px #3975e909; }
    .composer textarea { width: 100%; resize: none; min-height: 53px; max-height: 160px; border: 0; outline: none; background: transparent; color: var(--ink); padding: 0 1px 9px; font-size: 13px; line-height: 1.7; }
    .composer textarea::placeholder { color: #9aa3b3; }
    .composer-bottom { display: flex; gap: 8px; align-items: center; position: relative; }
    .composer-bottom .icon-btn { width: 28px; height: 28px; }
    .mode { display: flex; align-items: center; gap: 6px; border: 1px solid #e7edf7; background: #f8faff; border-radius: 6px; font-size: 11px; color: #647a9d; padding: 5px 8px; }
    .mode .icon { width: 13px; height: 13px; }
    .compose-spacer { flex: 1; }
    .model-trigger { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; padding: 6px; font-size: 11px; color: #667389; border-radius: 6px; }
    .model-trigger:hover { background: #f4f6fa; }
    .model-trigger .icon { width: 12px; height: 12px; }
    .send { width: 32px; height: 32px; display: grid; place-items: center; background: var(--blue); border: 0; border-radius: 9px; color: #fff; }
    .send:disabled { background: #e7edf6; color: #a0aec3; opacity: 1; }
    .send .icon { width: 16px; height: 16px; }
    .composer-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 3px 0; color: #a1a9b6; font-size: 10px; }
    .model-menu { bottom: 45px; right: 38px; width: 260px; }
    .model-menu .menu-label { font-size: 10px; color: #9ba4b4; padding: 9px 10px 6px; }
    .model-menu button { justify-content: space-between; }
    .model-menu button.selected { background: var(--blue-soft); color: var(--blue); }
    .model-menu small { display: block; margin-top: 4px; font-size: 10px; color: #939dac; }
    .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .attachment { position: relative; width: 64px; height: 54px; }
    .attachment img { width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--line); border-radius: 7px; }
    .attachment button { position: absolute; right: -5px; top: -5px; width: 19px; height: 19px; border: 1px solid #e4e8ef; border-radius: 50%; background: #fff; font-size: 13px; display: grid; place-items: center; padding: 0; }
    .file-tree { width: 218px; flex: none; background: #fafbfd; border-left: 1px solid var(--line); padding: 20px 16px; font-size: 11px; }
    .file-tree strong { display: block; font-size: 12px; font-weight: 600; margin-bottom: 20px; }
    .file-row { display: flex; align-items: center; gap: 8px; color: #73819a; margin: 15px 0; }
    .file-row .icon { width: 14px; height: 14px; }
    .file-row.indent { padding-left: 22px; }
    .detail-panel { max-width: 740px; margin: 40px auto; }
    .detail-panel h2 { font-size: 19px; font-weight: 600; }
    .detail-panel p { color: var(--muted); font-size: 12px; line-height: 1.8; }
    .change-row { padding: 16px; border: 1px solid var(--line); border-radius: 9px; display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 12px; }
    .change-row .change-count { margin-left: auto; color: #519778; }
    .change-row .remove-count { color: #bc7272; }
    .code { margin: 12px 0; padding: 15px; background: #f7f9fc; border: 1px solid var(--line); border-radius: 9px; font: 11px/1.9 ui-monospace, monospace; overflow-wrap: anywhere; white-space: pre-wrap; }
    .activity-row { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .activity-row small { color: var(--muted); margin-left: auto; }
    .activity-row .icon { color: #6484ba; }
    .toast { position: absolute; left: 50%; bottom: 185px; transform: translateX(-50%); max-width: calc(100% - 30px); background: #34425a; color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 8px; box-shadow: 0 6px 20px #23324d20; z-index: 30; text-align: center; }
    dialog { padding: 0; border: 1px solid var(--line); border-radius: 16px; width: min(400px, calc(100% - 32px)); box-shadow: 0 24px 80px #15243d30; color: var(--ink); }
    dialog::backdrop { background: #26384d35; backdrop-filter: blur(2px); }
    .dialog-body { padding: 24px; }
    .dialog-body h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    .dialog-body p { margin: 0 0 18px; font-size: 12px; color: var(--muted); line-height: 1.8; }
    .dialog-body input { width: 100%; border: 1px solid #dfe5ee; border-radius: 8px; padding: 11px; margin-bottom: 20px; font-size: 13px; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dialog-actions button { border: 1px solid #e1e7f0; background: #fff; border-radius: 7px; padding: 8px 16px; font-size: 12px; }
    .dialog-actions button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .dialog-actions button.danger { color: #fff; background: #c96a6a; border-color: #c96a6a; }
    .mobile-menu { display: none; }
    .sidebar-mask { display: none; }
    .shell.collapsed { grid-template-columns: minmax(0, 1fr); }
    .shell.collapsed .sidebar { display: none; }
    .shell.collapsed .mobile-menu { display: inline-flex; }
    @media (min-width: 1500px) { .welcome { max-width: 700px; } .welcome h2 { font-size: 34px; } }
    @media (max-height: 760px) and (min-width: 761px) { .welcome { padding: 28px 0; } .welcome-brand { margin-bottom: 16px; width: 42px; height: 42px; } .welcome h2 { font-size: 27px; } .suggestions { margin-top: 23px; gap: 9px; } .suggestion { padding: 13px; } .welcome-foot { margin-top: 17px; } .side-top { padding-top: 16px; } .side-heading { margin-bottom: 12px; } }

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[character]));
      const projects = [{id: 'sona', name: 'Sona Code', open: true}, {id: 'website', name: '个人网站', open: false}, {id: 'api', name: 'API 服务', open: false}, {id: 'data', name: '数据分析', open: false}, {id: 'docs', name: '文档工具', open: false}, {id: 'desktop', name: '桌面客户端', open: false}];
      const chatReply = `<p>可以把这个周末的目标定为：<strong>恢复精力，再留一点时间做喜欢的事。</strong>每天安排一件主要的事，剩下的时间留白。</p><h3>周六 · 出去走走</h3><ul><li><strong>上午：</strong>自然醒，慢慢吃一顿早餐。</li><li><strong>下午：</strong>去附近的公园散步，带一本书，找个舒服的地方坐一会儿。</li><li><strong>晚上：</strong>选一家想尝试的小店，或者在家做一道简单的菜。</li></ul><h3>周日 · 把时间留给自己</h3><ul><li><strong>上午：</strong>花半小时整理房间，再做一点轻量运动。</li><li><strong>下午：</strong>看电影、读书，或者继续一个搁置的小兴趣。</li><li><strong>晚上：</strong>用 15 分钟写下下周最重要的三件事，然后早点休息。</li></ul><blockquote>每一天都留一段没有安排的时间。计划的作用，是让你更轻松。</blockquote><p>你更喜欢出门走走，还是待在家里？可以按你的偏好再调整。</p>`;
      const sessions = [
        {id: 'weekend', title: '规划一个松弛的周末', kind: 'chat', day: '今天', pinned: false, model: 'Sona · 默认模型', messages: [{role: 'user', text: '帮我规划一个轻松的周末，不想安排得太满。'}, {role: 'assistant', html: chatReply}]},
        {id: 'mail', title: '让邮件表达更自然', kind: 'chat', day: '今天', pinned: false, model: 'Sona · 默认模型', messages: [{role: 'user', text: '想给同事发一封项目进度邮件，怎么写得专业又不生硬？'}, {role: 'assistant', html: '<p>可以按「当前进度 → 需要协作的事项 → 下一步」来组织。先让对方快速了解情况，再说明需要什么支持。</p><h3>一封简洁的示例</h3><blockquote>大家好，<br><br>同步一下本周的项目进展：核心功能已完成，目前正在进行联调。我们计划下周三完成这一轮验证。<br><br>还需要大家协助确认两项内容：接口字段定义，以及测试环境的访问权限。方便的话，请在周一前给我反馈。<br><br>如有需要调整的地方，我们可以随时沟通。谢谢大家！</blockquote><p>如果你贴出草稿，我可以帮你保留原意，调整措辞和结构。</p>'}]},
        {id: 'context', title: '理解大模型的上下文窗口', kind: 'chat', day: '昨天', pinned: true, model: 'Sona · 深度思考', messages: [{role: 'user', text: '用简单的例子解释一下，什么是大语言模型的上下文窗口？'}, {role: 'assistant', html: '<p>可以把上下文窗口想成一张<strong>大小有限的工作桌</strong>。模型回答问题时，只能参考摆在这张桌子上的材料。</p><ul><li>你发来的问题、前面的对话和相关资料，都会占用桌面。</li><li>窗口越大，一次能放下的材料就越多。</li><li>材料太多时，就需要摘要、删减，或重新选择相关内容。</li></ul><p>它决定的是一次处理的信息范围，不等于模型会永久记住这些内容。</p>'}]},
        {id: 'python', title: 'Python 入门，从哪里开始', kind: 'chat', day: '昨天', pinned: false, model: 'Sona · 默认模型', messages: [{role: 'user', text: '我刚开始学 Python，应该从哪里开始？'}, {role: 'assistant', html: '<p>先用一个小目标带着学：<strong>写一个能整理日常待办的小程序。</strong></p><h3>第一周 · 学会表达逻辑</h3><ul><li>变量、字符串和列表。</li><li>条件判断、循环和函数。</li><li>用命令行输入待办，并打印列表。</li></ul><h3>第二周 · 做一个能用的小工具</h3><ul><li>学习文件读写，把待办保存下来。</li><li>加入完成、删除和搜索功能。</li><li>遇到错误时，练习读报错信息。</li></ul><p>每天练习 30 分钟，比一次读完很多教程更容易坚持。</p>'}]},
        {id: 'workspace', title: '优化工作区的侧栏交互', kind: 'project', project: 'sona', day: '今天', pinned: false, model: 'Sona · 默认模型', messages: [{role: 'user', text: '让侧栏里的项目和对话更容易区分，同时保留当前会话的定位能力。'}, {role: 'assistant', html: '<p>侧栏默认完整展示项目树。普通对话通过顶部切换进入，并记住上次打开的对话；返回项目时恢复原来的工作内容。</p><h3>这次调整的重点</h3><ul><li>项目标题采用文件夹图标，对话使用气泡图标。</li><li>当前会话使用浅蓝背景，展开所属项目。</li><li>侧栏收起后，在对话顶部保留展开入口。</li></ul><p>可以从上方的「文件改动」查看示例，也可以点击右上角的目录按钮浏览项目文件。</p>'}]},
        {id: 'model', title: '模型选择器的细节调整', kind: 'project', project: 'sona', day: '昨天', pinned: false, model: 'Sona · 默认模型', messages: [{role: 'user', text: '调整模型选择器的层级和说明文案。'}, {role: 'assistant', html: '<p>把模型名称放在第一行，能力说明放在第二行。当前选择用勾选图标标记，并保持菜单宽度稳定。</p><p>默认选择跟随应用设置，用户切换模型后，对话里保留这次选择。</p>'}]},

      ];

      function renderMessages(follow = false) {

      function updateSend() {

      function selectSession(session) {

      function cannedResponse(text) {
        if (/周末|散步|旅行/.test(text)) return chatReply;

        if (tab === 'changes') $('detail-panel').innerHTML = '<h2>文件改动</h2><p>当前项目对话的改动摘要 · 示例</p><div class="change-row">' + icon('file') + '<span>sona_code/web/static/workspace.js</span><span class="change-count">+ 18</span><span class="remove-count">− 6</span></div><pre class="code">  function renderSidebar() {\n<span style="color:#4a946e">+   renderChatSection();\n+   renderProjectSection();</span>\n  }</pre>';
